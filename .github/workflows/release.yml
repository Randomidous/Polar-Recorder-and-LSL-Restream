name: Build and Release

on:
  release:
    types: [created]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build executable
        run: |
          $pylsl_path = python -c "import pylsl; import os; print(os.path.dirname(pylsl.__file__))"
          pyinstaller --onefile --windowed --name "PolarRecorder" `
            --add-binary "$pylsl_path\liblsl64.dll;pylsl" `
            record/LSL-Lab.py

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PolarRecorder.exe
